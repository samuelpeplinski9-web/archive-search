<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive.org Search Engine</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-color: #bb86fc;
            --border-color: #333;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        .search-container {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        input {
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            color: var(--text-color);
            width: 100%;
            max-width: 500px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            background: var(--primary-color);
            color: #000;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        
        .loading {
            text-align: center;
            display: none;
            margin: 20px 0;
            color: var(--primary-color);
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-4px); }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #000;
        }
        .card-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .card-title {
            font-size: 1.1em;
            margin: 0 0 10px 0;
            font-weight: bold;
            line-height: 1.4;
        }
        .card-meta {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 15px;
        }
        .card-link {
            margin-top: auto;
            text-decoration: none;
            background: #333;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.9em;
        }
        .card-link:hover { background: #444; }
    </style>
</head>
<body>

    <header>
        <h1>Archive Engine</h1>
        <p>Search the Internet Archive directly from your browser</p>
        <form class="search-container" id="searchForm">
            <input type="text" id="searchInput" placeholder="Search for audio, video, software, texts..." required>
            <button type="submit">Search</button>
        </form>
    </header>

    <div class="loading" id="loading">Fetching records from Archive.org...</div>
    <div class="results-grid" id="resultsGrid"></div>

    <script>
        const form = document.getElementById('searchForm');
        const input = document.getElementById('searchInput');
        const grid = document.getElementById('resultsGrid');
        const loading = document.getElementById('loading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = input.value.trim();
            if (!query) return;

            grid.innerHTML = '';
            loading.style.display = 'block';

            try {
                // Construct the Archive.org Advanced Search API URL
                // We request specific fields (fl[]) to keep the payload lightweight
                const fields = 'identifier,title,creator,mediatype,year';
                const url = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(query)}&fl[]=${fields.split(',').join('&fl[]=')}&rows=50&output=json`;

                const response = await fetch(url);
                const data = await response.json();
                
                loading.style.display = 'none';
                
                const docs = data.response.docs;
                if (docs.length === 0) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No results found.</p>';
                    return;
                }

                docs.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const title = item.title || 'Untitled';
                    const creator = item.creator ? (Array.isArray(item.creator) ? item.creator[0] : item.creator) : 'Unknown Creator';
                    const year = item.year || 'Unknown Year';
                    const type = item.mediatype || 'unknown';
                    
                    // Uses the thumbnail API
                    const imgUrl = `https://archive.org/services/img/${item.identifier}`;
                    // Link directly to the item's detail page
                    const itemUrl = `https://archive.org/details/${item.identifier}`;

                    card.innerHTML = `
                        <img src="${imgUrl}" alt="Thumbnail" loading="lazy" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMzMzMiLz48L3N2Zz4='">
                        <div class="card-content">
                            <h3 class="card-title">${title}</h3>
                            <div class="card-meta">
                                <div>Type: ${type}</div>
                                <div>By: ${creator}</div>
                                <div>Year: ${year}</div>
                            </div>
                            <a href="${itemUrl}" target="_blank" class="card-link">View Details</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                loading.style.display = 'none';
                grid.innerHTML = `<p style="grid-column: 1/-1; color: #ff5555;">Error fetching data: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
